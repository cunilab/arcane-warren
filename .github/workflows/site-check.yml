name: Site checks
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/build.mjs
      - run: python3 scripts/check_site.py
      - run: node --check site.js
      - run: git diff --exit-code
